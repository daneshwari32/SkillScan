<!DOCTYPE html>
<html>
<head>
<title>SkillScan - Resume Analyzer</title>
<style>
    body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex; justify-content: center; align-items: center;margin: 0%}
    .box{background:white;padding:40px; border-radius:20px; width:420px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);text-align: center}
    h2{color: #333}
    input{margin:25px 0}
    button{background: #6c5ce7;color: white;padding: 12px 25px; border:none;border-radius: 10px;cursor:pointer;font-size: 16px;width:100%}
    button:hover{background: #5a4bd1}

</style>
</head>
<body>
     <div class="box">
     <h2>SkillScan</h2>
     <P>upload your resume and discover your perfect job match </P>
     <form action="/analyze/"method= "post"enctype="multipart/form-data">
        {%csrf_token%}
        <input type = "file" name="resume" accept=".pdf,.docx" required><br>
        <button type="submit">Analyze Resume</button>
        
     </form>
    </div>

</body>
</html>
